name: Deploy to Vercel (prebuilt)

# Pixzference's Next.js build needs a ~4 GB V8 heap, which exceeds the Vercel
# Hobby build container (~2 GB) and OOMs there. We therefore build here on a
# 16 GB GitHub runner and ship the compiled output to Vercel as a prebuilt
# deployment. Git-triggered builds on Vercel are disabled for this project
# (Ignored Build Step = "exit 0"), so this workflow is the only deploy path.
#
# Cloud profile (PIXZFERENCE_CLOUD=1): the runner trims the deployment to a
# serverless-friendly shape before building — curated i18n subset (see
# scripts/build/cloud-trim.mjs), playwright/onnxruntime out of the lambda
# trace (see next.config.mjs outputFileTracingExcludes) — so the prebuilt
# upload stays small enough for `vercel deploy --prebuilt` to complete.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Cloud profile + never download browser binaries on the build runner:
      # browser automation cannot run inside serverless functions anyway.
      PIXZFERENCE_CLOUD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cloud profile trim (i18n locale diet)
        run: node scripts/build/cloud-trim.mjs

      # Move ~200 serverless-impossible API routes (local spawn, WS servers,
      # native addons, host control) out of the build so they never compile
      # into lambdas. Fail-closed import guard keeps any dir still referenced
      # by kept code. Trimmed paths fall through to the JSON-404 catch-all.
      - name: Cloud profile trim (serverless-impossible routes)
        run: node scripts/build/cloud-trim-routes.mjs

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment (production)
        run: npx vercel@latest pull --yes --environment=production --scope pixz19s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel Build Output API)
        run: npx vercel@latest build --prod --scope pixz19s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Measure build output
        if: always()
        run: |
          echo "=== .vercel/output total ==="
          du -sh .vercel/output || true
          echo "=== top-level breakdown ==="
          du -sh .vercel/output/* 2>/dev/null | sort -rh | head -10
          echo "=== static breakdown ==="
          du -sh .vercel/output/static/* 2>/dev/null | sort -rh | head -15
          echo "=== functions breakdown (biggest) ==="
          du -sh .vercel/output/functions/* 2>/dev/null | sort -rh | head -15
          echo "=== files larger than 2 MB ==="
          find .vercel/output -type f -size +2M -exec du -h {} \; 2>/dev/null | sort -rh | head -25

      # The Next.js build trace (diagnostics/trace, ~105 MB for this monorepo)
      # is optional build-analysis metadata, not a runtime asset. Uploaded as a
      # single file it exceeds Vercel's 100 MB per-file limit and aborts the
      # deploy with "File size limit exceeded (100 MB)", so strip it.
      - name: Strip build diagnostics (exceeds 100 MB per-file upload limit)
        run: rm -rf .vercel/output/diagnostics

      - name: Deploy prebuilt output to production
        run: |
          # --archive=tgz packs the output into a single tarball (1 upload
          # request) instead of one request per file. The Hobby plan caps CLI
          # uploads at 5000 file requests / 24h ("api-upload-free") and this
          # monorepo's traced functions blow through it; tgz also avoids the
          # per-file size path entirely and uploads ~30% faster.
          for attempt in 1 2 3; do
            echo "::group::Deploy attempt ${attempt}"
            if npx vercel@latest deploy --prebuilt --prod --archive=tgz --scope pixz19s-projects --token=${{ secrets.VERCEL_TOKEN }}; then
              echo "::endgroup::"
              echo "Deploy succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            echo "Deploy attempt ${attempt} failed; retrying after backoff..."
            sleep $((attempt * 20))
          done
          echo "All deploy attempts failed"
          exit 1

      # Post-deploy diagnostics: hit the production alias (the plain
      # <project>.vercel.app domain — never the custom domain in repo files)
      # and stream the deployment's runtime logs while traffic is generated,
      # so boot/runtime errors are captured in the CI log for debugging.
      - name: Smoke test + capture runtime logs
        if: always()
        run: |
          echo "=== HTTP smoke (production alias) ==="
          for path in /healthz /login /api/v1/models; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://pixzference.vercel.app${path}" || echo "ERR")
            echo "${path} -> ${code}"
          done
          echo "=== Boot diagnostics (degraded-mode boot error) ==="
          curl -s --max-time 20 -H "x-boot-debug: pixz" "https://pixzference.vercel.app/boot-diagnostics" || true
          echo
          echo "=== healthz headers ==="
          curl -sI --max-time 20 "https://pixzference.vercel.app/healthz" || true
          echo "=== Runtime logs (45s stream while generating traffic) ==="
          ( for i in 1 2 3 4 5 6 7 8; do
              curl -s -o /dev/null --max-time 15 "https://pixzference.vercel.app/healthz" || true
              curl -s -o /dev/null --max-time 15 "https://pixzference.vercel.app/login" || true
              sleep 4
            done ) &
          TRAFFIC_PID=$!
          timeout 50 npx vercel@latest logs https://pixzference.vercel.app --scope pixz19s-projects --token=${{ secrets.VERCEL_TOKEN }} || true
          kill $TRAFFIC_PID 2>/dev/null || true
